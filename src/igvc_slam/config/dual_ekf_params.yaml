# For parameter descriptions, please refer to the template parameter files for each node.

# https://docs.ros.org/en/rolling/p/robot_localization/configuring_robot_localization.html

ekf_node_odom:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true # Recommended to use 2d mode for nav2 in mostly planar environments
    print_diagnostics: true
    debug: false # Set to true and specify 'debug_out_file:' to enable debug mode
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    #Wheel odometry
    odom0: /bot_drive_controller/odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    #ZED Visual Inertial Odometry
    odom1: /zed/zed_node/odom
    odom1_config: [true, true, false, # position
                  false, false, true, # orientation
                  false,  false, false, # linear velocity; not fusing y velocity because ZED mast may move
                  false, false, false, # angular velocity
                  false, false, false] # linear acceleration
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10

    use_control: false

ekf_node_map:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true  # Recommended to use 2d mode for nav2 in mostly planar environments
    print_diagnostics: true
    debug: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /odometry/local
    odom0_config: [false, false, false, # position
                  false, false, true, # orientation
                  true,  true,  false, # linear velocity
                  false, false, true, # angular velocity
                  false, false, false] # linear acceleration
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    odom1: /odometry/gps
    odom1_config: [true,  true,  false, # position
                  false, false, false, # orientation
                  false, false, false, # linear velocity
                  false, false, false, # angular velocity
                  false, false, false] # linear acceleration
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    use_control: false
  
navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0 # RTK heading is referenced to true north, not magnetic north
    yaw_offset: 0.0 # RTK heading must already be converted to ROS ENU yaw (0 = East, CCW positive)   
    publish_filtered_gps: true # Publish GPS position transformed back from filtered odometry
    use_odometry_yaw: false # Use RTK heading from /imu/data instead of EKF odometry yaw (set to true if compass doesn't work)
    wait_for_datum: false # Initialize from first valid GPS fix
    zero_altitude: true # Ground robot operating in 2D
    broadcast_cartesian_transform: false # No UTM -> world TF required currently
    transform_timeout: 0.0 # Default TF lookup behavior
