lane_points_node:
  ros__parameters:
    image_topic: /zed/zed_node/rgb/color/rect/image
    cloud_topic: /zed/zed_node/point_cloud/cloud_registered
    points_topic: /lanes/points
    debug_topic: /lanes/debug_image

    roi_top_fraction: 0.40
    roi_bottom_fraction: 0.90
    # Pixel is "bright" if V >= min_value_ratio * local median V (shadow-robust; replaces min_value)
    min_value_ratio: 1.15
    local_median_ksize: 61   # odd, wider than the widest line in the image (~40 px near the robot)
    max_saturation: 40       

    blur_kernel_size: 11
    blur_sigma: 2.0

    normalize_alpha: 20
    normalize_beta: 200

    canny_low: 25
    canny_high: 150
    hough_min_line_length: 5
    hough_max_line_gap: 40
    hough_threshold: 45
    line_sample_step_px: 5

    min_range_m: 0.3
    max_range_m: 10.0
    max_abs_xyz_m: 20.0
    max_points: 3000
    max_z: 0.05
    max_dz: 2.0
    depth_fill_ksize: 9      # fill stereo holes on paint before z/dz/range filters (0 = off)